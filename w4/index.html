
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Slider</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- IMAGE SLIDER SECTION -->
    <section id="slider">
        <h2>Image Gallery Slider</h2>

        <div class="slider-container">

            <button class="nav-btn prev" aria-label="Previous slide">
                &#10094;
            </button>

            <div class="slider-wrapper">
                <div class="slider-track">
                    <img src="./images/IMG1.JPEG" alt="Slide 1">
                    <img src="./images/IMG3.jpg" alt="Slide 2">
                    <img src="./images/IMG2.jpg" alt="Slide 3">
                    <img src="./images/IMG4.jpg" alt="Slide 4">
                    <img src="./images/IMG5.jpg" alt="Slide 5">
                </div>
            </div>

            <button class="nav-btn next" aria-label="Next slide">
                &#10095;
            </button>

        </div>

        <div class="dots-container"></div>
    </section>

</body>
</html>
